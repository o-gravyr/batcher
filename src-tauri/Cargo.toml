[package]
name = "gravyr-batcher"
version = "0.1.0"
description = "Batch text + logo overlay on images from a CSV or XLSX"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gravyr_batcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
turbojpeg = { version = "1", default-features = false, features = ["cmake", "require-simd"] }
rayon = "1"
csv = "1"
calamine = "0.26"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
ab_glyph = "0.2"
imageproc = { version = "0.25", default-features = false }
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
